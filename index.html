<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CronCraft — Visual Cron Expression Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
        surface: { 50:'#2a2a2e',100:'#222225',200:'#1c1c1f',300:'#18181b',400:'#141416',500:'#111113' }
      }
    }
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  body { background: #111113; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .toggle-cell { transition: all .15s ease; }
  .toggle-cell.active { background: rgba(245,158,11,.25); border-color: #f59e0b; color: #fbbf24; }
  .toggle-cell:not(.active):hover { background: rgba(245,158,11,.08); }
  .field-tab { transition: all .15s ease; }
  .field-tab.active { background: rgba(245,158,11,.2); color: #fbbf24; border-color: #f59e0b; }
  .field-tab:not(.active):hover { background: rgba(255,255,255,.05); }
  .mode-btn.active { background: rgba(245,158,11,.2); color: #fbbf24; border-color: #f59e0b; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .preset-btn { transition: all .15s ease; }
  .preset-btn:hover { background: rgba(245,158,11,.15); border-color: #d97706; }
  .copy-flash { animation: flash .4s ease; }
  @keyframes flash { 0%{background:rgba(245,158,11,.3)} 100%{background:transparent} }
</style>
</head>
<body class="text-gray-300 min-h-screen">

<!-- Header -->
<header class="border-b border-gray-800 px-6 py-4 flex items-center gap-4">
  <div class="flex items-center gap-2">
    <svg class="w-8 h-8 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <h1 class="text-2xl font-bold text-brand-400 mono">CronCraft</h1>
  </div>
  <span class="text-gray-500 text-sm hidden sm:inline">Visual Cron Expression Builder</span>
  <div class="ml-auto flex items-center gap-2">
    <span class="text-xs text-gray-500 mono" id="fieldLabel">5-field (standard)</span>
    <button onclick="toggleFieldMode()" class="px-3 py-1 text-xs rounded border border-gray-700 hover:border-brand-600 hover:text-brand-400 transition">Toggle 6-field</button>
  </div>
</header>

<!-- Cron Expression Display -->
<div class="px-6 py-4 border-b border-gray-800">
  <div class="flex items-center gap-3">
    <div class="flex-1 relative">
      <input id="cronInput" type="text" spellcheck="false"
        class="mono text-2xl font-bold bg-surface-100 border border-gray-700 rounded-lg px-4 py-3 w-full text-brand-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500/50 placeholder-gray-600"
        placeholder="* * * * *" oninput="onCronInput(this.value)" />
    </div>
    <button onclick="copyExpression()" id="copyBtn"
      class="px-4 py-3 bg-brand-600 hover:bg-brand-500 text-black font-semibold rounded-lg transition flex items-center gap-2 whitespace-nowrap">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy
    </button>
  </div>
  <!-- Field labels -->
  <div id="fieldHeaders" class="flex mt-2 mono text-xs text-gray-500 gap-0">
    <span class="flex-1 text-center" id="fh0">min</span>
    <span class="flex-1 text-center" id="fh1">hour</span>
    <span class="flex-1 text-center" id="fh2">day</span>
    <span class="flex-1 text-center" id="fh3">month</span>
    <span class="flex-1 text-center" id="fh4">dow</span>
  </div>
</div>

<!-- Main Content -->
<div class="flex flex-col lg:flex-row gap-0">

  <!-- Left Panel: Visual Builder -->
  <div class="lg:w-[55%] border-r border-gray-800 p-4">
    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Visual Builder</h2>

    <!-- Field Tabs -->
    <div id="fieldTabs" class="flex gap-1 mb-4 flex-wrap">
      <!-- Generated by JS -->
    </div>

    <!-- Mode Selector -->
    <div class="flex gap-2 mb-4">
      <button class="mode-btn field-tab px-3 py-1.5 text-sm rounded border border-gray-700" data-mode="every" onclick="setMode('every')">Every</button>
      <button class="mode-btn field-tab px-3 py-1.5 text-sm rounded border border-gray-700" data-mode="specific" onclick="setMode('specific')">Specific</button>
      <button class="mode-btn field-tab px-3 py-1.5 text-sm rounded border border-gray-700" data-mode="range" onclick="setMode('range')">Range</button>
      <button class="mode-btn field-tab px-3 py-1.5 text-sm rounded border border-gray-700" data-mode="step" onclick="setMode('step')">Step</button>
    </div>

    <!-- Every panel -->
    <div id="panelEvery" class="mb-4 hidden">
      <p class="text-gray-400 text-sm">Runs every <span id="everyLabel">minute</span></p>
    </div>

    <!-- Specific panel -->
    <div id="panelSpecific" class="mb-4 hidden">
      <div id="specificGrid" class="grid gap-1" style="grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Range panel -->
    <div id="panelRange" class="mb-4 hidden">
      <div class="flex items-center gap-3 text-sm">
        <label class="text-gray-400">From</label>
        <select id="rangeFrom" class="bg-surface-100 border border-gray-700 rounded px-2 py-1 text-brand-400 mono focus:outline-none focus:border-brand-500" onchange="onRangeChange()"></select>
        <label class="text-gray-400">To</label>
        <select id="rangeTo" class="bg-surface-100 border border-gray-700 rounded px-2 py-1 text-brand-400 mono focus:outline-none focus:border-brand-500" onchange="onRangeChange()"></select>
      </div>
    </div>

    <!-- Step panel -->
    <div id="panelStep" class="mb-4 hidden">
      <div class="flex items-center gap-3 text-sm">
        <label class="text-gray-400">Starting at</label>
        <select id="stepStart" class="bg-surface-100 border border-gray-700 rounded px-2 py-1 text-brand-400 mono focus:outline-none focus:border-brand-500" onchange="onStepChange()"></select>
        <label class="text-gray-400">every</label>
        <select id="stepN" class="bg-surface-100 border border-gray-700 rounded px-2 py-1 text-brand-400 mono focus:outline-none focus:border-brand-500" onchange="onStepChange()"></select>
        <span id="stepUnit" class="text-gray-400">minutes</span>
      </div>
    </div>

    <!-- Quick syntax input for current field -->
    <div class="mt-4 pt-4 border-t border-gray-800">
      <label class="text-xs text-gray-500 block mb-1">Direct field input</label>
      <input id="fieldDirect" type="text" class="mono bg-surface-100 border border-gray-700 rounded px-3 py-1.5 text-sm text-brand-300 w-full focus:outline-none focus:border-brand-500" oninput="onFieldDirect(this.value)" />
    </div>
  </div>

  <!-- Right Panel -->
  <div class="lg:w-[45%] p-4 flex flex-col gap-5">

    <!-- Human-Readable Description -->
    <div>
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Description</h2>
      <div id="description" class="bg-surface-100 border border-gray-800 rounded-lg p-4 text-brand-300 text-lg font-medium">
        Every minute
      </div>
    </div>

    <!-- Special Syntax Notice -->
    <div id="syntaxNotice" class="hidden">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Syntax Details</h2>
      <div id="syntaxInfo" class="bg-surface-100 border border-gray-800 rounded-lg p-3 text-sm text-gray-400"></div>
    </div>

    <!-- Next Executions -->
    <div>
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Next 10 Executions</h2>
      <div id="execList" class="bg-surface-100 border border-gray-800 rounded-lg p-3 space-y-1 max-h-64 overflow-y-auto mono text-sm">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Presets -->
    <div>
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Common Presets</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="presetsGrid">
        <!-- Generated by JS -->
      </div>
    </div>

  </div>
</div>

<footer class="border-t border-gray-800 px-6 py-3 text-center text-xs text-gray-600">
  CronCraft &mdash; runs entirely in your browser, no data sent anywhere.
</footer>

<script>
// ─── State ───
let useSeconds = false; // 5-field vs 6-field
let activeField = 0;    // index into field configs
let fields = [];        // current parsed field values

const FIELD_CONFIGS_5 = [
  { name: 'minute',  label: 'Minute',   min: 0, max: 59, unit: 'minute(s)' },
  { name: 'hour',    label: 'Hour',     min: 0, max: 23, unit: 'hour(s)' },
  { name: 'dom',     label: 'Day',      min: 1, max: 31, unit: 'day(s)' },
  { name: 'month',   label: 'Month',    min: 1, max: 12, unit: 'month(s)', names: ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'] },
  { name: 'dow',     label: 'Weekday',  min: 0, max: 7,  unit: 'day(s)', names: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat','Sun'] },
];

const FIELD_CONFIGS_6 = [
  { name: 'second',  label: 'Second',   min: 0, max: 59, unit: 'second(s)' },
  ...FIELD_CONFIGS_5,
];

function getConfigs() { return useSeconds ? FIELD_CONFIGS_6 : FIELD_CONFIGS_5; }

// ─── Presets ───
const PRESETS = [
  { label: 'Every minute',   expr: '* * * * *' },
  { label: 'Every 5 min',    expr: '*/5 * * * *' },
  { label: 'Every 10 min',   expr: '*/10 * * * *' },
  { label: 'Every 15 min',   expr: '*/15 * * * *' },
  { label: 'Every 30 min',   expr: '*/30 * * * *' },
  { label: 'Hourly',         expr: '0 * * * *' },
  { label: 'Every 6 hours',  expr: '0 */6 * * *' },
  { label: 'Daily midnight', expr: '0 0 * * *' },
  { label: 'Daily 9am',      expr: '0 9 * * *' },
  { label: 'Weekdays 9am',   expr: '0 9 * * 1-5' },
  { label: 'Weekly (Mon)',    expr: '0 0 * * 1' },
  { label: 'Monthly (1st)',   expr: '0 0 1 * *' },
  { label: 'Yearly',         expr: '0 0 1 1 *' },
  { label: 'Every Sunday',   expr: '0 0 * * 0' },
  { label: 'Every Saturday', expr: '0 0 * * 6' },
  { label: 'Weekends noon',  expr: '0 12 * * 0,6' },
  { label: 'Every quarter',  expr: '0 0 1 1,4,7,10 *' },
  { label: '@hourly',        expr: '@hourly' },
  { label: '@daily',         expr: '@daily' },
  { label: '@weekly',        expr: '@weekly' },
  { label: '@monthly',       expr: '@monthly' },
  { label: '@yearly',        expr: '@yearly' },
];

// ─── Cron Expression Parsing ───
const ALIASES = {
  '@yearly':  '0 0 1 1 *',
  '@annually':'0 0 1 1 *',
  '@monthly': '0 0 1 * *',
  '@weekly':  '0 0 * * 0',
  '@daily':   '0 0 * * *',
  '@hourly':  '0 * * * *',
  '@reboot':  null, // special
};

function resolveAlias(expr) {
  const e = expr.trim().toLowerCase();
  if (ALIASES[e] !== undefined) return ALIASES[e];
  return expr.trim();
}

function parseField(field, min, max) {
  // Returns array of matching values, or null if unparseable
  if (field === '*') return Array.from({length: max - min + 1}, (_, i) => min + i);

  const values = new Set();
  const parts = field.split(',');

  for (const part of parts) {
    if (part.includes('/')) {
      const [rangeStr, stepStr] = part.split('/');
      const step = parseInt(stepStr, 10);
      if (isNaN(step) || step <= 0) return null;
      let rangeValues;
      if (rangeStr === '*') {
        rangeValues = Array.from({length: max - min + 1}, (_, i) => min + i);
      } else if (rangeStr.includes('-')) {
        rangeValues = parseRange(rangeStr, min, max);
        if (!rangeValues) return null;
      } else {
        const s = parseInt(rangeStr, 10);
        if (isNaN(s)) return null;
        rangeValues = [s];
      }
      for (let i = 0; i < rangeValues.length; i += step) {
        values.add(rangeValues[i]);
      }
    } else if (part.includes('-')) {
      const rv = parseRange(part, min, max);
      if (!rv) return null;
      rv.forEach(v => values.add(v));
    } else {
      const v = parseInt(part, 10);
      if (isNaN(v)) return null;
      values.add(v);
    }
  }

  return Array.from(values).sort((a, b) => a - b);
}

function parseRange(rangeStr, min, max) {
  const [a, b] = rangeStr.split('-').map(Number);
  if (isNaN(a) || isNaN(b)) return null;
  const result = [];
  for (let i = a; i <= b; i++) result.push(i);
  return result;
}

function parseCron(expr) {
  const resolved = resolveAlias(expr);
  if (resolved === null) {
    return { isReboot: true, fields: null };
  }

  const parts = resolved.split(/\s+/);
  let offset = 0;
  let seconds = null;

  if (parts.length === 6) {
    seconds = parseField(parts[0], 0, 59);
    offset = 1;
  } else if (parts.length !== 5) {
    return null;
  }

  const configs = parts.length === 6 ? FIELD_CONFIGS_6 : FIELD_CONFIGS_5;
  const parsed = [];
  for (let i = 0; i < 5 + (seconds !== null ? 1 : 0); i++) {
    const cfg = configs[i];
    parsed.push(parseField(parts[i], cfg.min, cfg.max));
  }

  return { isReboot: false, hasSeconds: seconds !== null, fields: parsed, raw: parts };
}

// ─── Human-Readable Description ───
function describe(expr) {
  const trimmed = expr.trim().toLowerCase();
  const aliasNames = {
    '@yearly': 'Once a year (January 1 at midnight)',
    '@annually': 'Once a year (January 1 at midnight)',
    '@monthly': 'Once a month (1st at midnight)',
    '@weekly': 'Once a week (Sunday at midnight)',
    '@daily': 'Every day at midnight',
    '@hourly': 'Every hour at minute 0',
    '@reboot': 'At system startup',
  };
  if (aliasNames[trimmed]) return aliasNames[trimmed];

  const parsed = parseCron(expr);
  if (!parsed || !parsed.fields) return 'Invalid cron expression';

  const cfgs = parsed.hasSeconds ? FIELD_CONFIGS_6 : FIELD_CONFIGS_5;
  const f = parsed.fields;
  const fl = cfgs.length;

  let parts = [];
  const allValues = (i) => {
    const cfg = cfgs[i];
    return f[i] && f[i].length === (cfg.max - cfg.min + 1);
  };

  // Seconds
  let idx = 0;
  if (parsed.hasSeconds) {
    if (!allValues(0)) parts.push(describeValues(f[0], 'second'));
    idx = 1;
  }

  // Minute
  if (!allValues(idx)) parts.push(describeValues(f[idx], 'minute'));
  idx++;

  // Hour
  if (!allValues(idx)) {
    const mins = f[idx - 1];
    const minuteStr = (mins && mins.length === 1 && mins[0] === 0) ? '' : `:${pad2(mins ? mins[0] : 0)}`;
    parts.push(describeValues(f[idx], 'hour', minuteStr));
  } else {
    // "every minute" implied unless specified
  }
  idx++;

  // DOM
  if (!allValues(idx)) parts.push('on day ' + describeValues(f[idx], 'day-of-month'));
  idx++;

  // Month
  if (!allValues(idx)) {
    const monthNames = f[idx].map(m => FIELD_CONFIGS_5[3].names[m]).join(', ');
    parts.push('in ' + monthNames);
  }
  idx++;

  // DOW
  if (!allValues(idx) && f[idx]) {
    // Normalize 7 -> 0
    const dowVals = f[idx].map(v => v === 7 ? 0 : v);
    const uniqDows = [...new Set(dowVals)].sort((a,b) => a - b);
    const dayNames = uniqDows.map(d => FIELD_CONFIGS_5[4].names[d]).join(', ');
    parts.push('on ' + dayNames);
  }

  if (parts.length === 0) return parsed.hasSeconds ? 'Every second' : 'Every minute';

  // Build natural sentence
  let desc = '';
  if (parsed.hasSeconds && allValues(0)) {
    desc = 'Every minute';
  } else if (parsed.hasSeconds) {
    desc = parts.join(', ');
  } else {
    desc = parts.join(', ');
  }

  // Capitalize first letter
  return desc.charAt(0).toUpperCase() + desc.slice(1);
}

function describeValues(vals, unit, suffix) {
  if (!vals || vals.length === 0) return '';
  if (suffix === undefined) suffix = '';

  const cfg = FIELD_CONFIGS_5.find(c => c.unit === unit + '(s)') || FIELD_CONFIGS_6.find(c => c.unit === unit + '(s)');
  if (cfg && cfg.names && vals.length <= 7) {
    return vals.map(v => cfg.names[v] || v).join(', ') + suffix;
  }

  if (vals.length === 1) return vals[0] + suffix;

  // Check if arithmetic progression
  const step = vals[1] - vals[0];
  let isAP = step > 0 && vals.every((v, i) => i === 0 || v - vals[i-1] === step);
  if (isAP && vals.length > 2) {
    return `every ${step} ${unit}${suffix} starting at ${vals[0]}`;
  }

  return vals.join(', ') + suffix;
}

function pad2(n) { return String(n).padStart(2, '0'); }

// ─── Next N Executions ───
function nextExecutions(expr, count = 10) {
  const trimmed = expr.trim().toLowerCase();
  if (trimmed === '@reboot') return [];

  const parsed = parseCron(expr);
  if (!parsed || !parsed.fields) return [];

  const cfgs = parsed.hasSeconds ? FIELD_CONFIGS_6 : FIELD_CONFIGS_5;
  const f = parsed.fields;

  const hasSeconds = parsed.hasSeconds;
  const secVals = hasSeconds ? f[0] : [0];
  const minVals = f[hasSeconds ? 1 : 0];
  const hourVals = f[hasSeconds ? 2 : 1];
  const domVals = f[hasSeconds ? 3 : 2];
  const monthVals = f[hasSeconds ? 4 : 3];
  const dowField = f[hasSeconds ? 5 : 4];

  if (!minVals || !hourVals || !domVals || !monthVals || !dowField) return [];

  // Normalize dow: 7 -> 0
  const dowVals = new Set(dowField.map(v => v === 7 ? 0 : v));

  const results = [];
  const now = new Date();
  now.setMilliseconds(0);
  if (!hasSeconds) now.setSeconds(0);

  let d = new Date(now.getTime() + 1000); // start from next second/minute

  // Safety limit
  const maxIter = 500000;
  let iter = 0;

  while (results.length < count && iter < maxIter) {
    iter++;

    const mo = d.getMonth() + 1;
    if (!monthVals.includes(mo)) {
      // Jump to next valid month
      let nextMo = monthVals.find(m => m > mo);
      if (nextMo === undefined) {
        d = new Date(d.getFullYear() + 1, monthVals[0] - 1, 1, 0, 0, 0);
      } else {
        d = new Date(d.getFullYear(), nextMo - 1, 1, 0, 0, 0);
      }
      continue;
    }

    const dom = d.getDate();
    const dow = d.getDay();
    const domMatch = domVals.includes(dom);
    const dowMatch = dowVals.has(dow);

    // In cron, if both dom and dow are restricted (not *), either can match
    const cfgs5 = FIELD_CONFIGS_5;
    const domAll = domVals.length === (cfgs5[2].max - cfgs5[2].min + 1);
    const dowAll = dowVals.size === (cfgs5[4].max - cfgs5[4].min + 1);

    let dayMatch;
    if (!domAll && !dowAll) {
      dayMatch = domMatch || dowMatch;
    } else {
      dayMatch = domMatch && dowMatch;
    }

    if (!dayMatch) {
      d = new Date(d.getFullYear(), d.getMonth(), dom + 1, 0, 0, 0);
      continue;
    }

    if (!hourVals.includes(d.getHours())) {
      const nextH = hourVals.find(h => h > d.getHours());
      if (nextH !== undefined) {
        d.setHours(nextH, 0, 0);
      } else {
        d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, hourVals[0], 0, 0);
      }
      continue;
    }

    if (!minVals.includes(d.getMinutes())) {
      const nextM = minVals.find(m => m > d.getMinutes());
      if (nextM !== undefined) {
        d.setMinutes(nextM, 0, 0);
      } else {
        const nextH = hourVals.find(h => h > d.getHours());
        if (nextH !== undefined) {
          d.setHours(nextH, minVals[0], 0, 0);
        } else {
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, hourVals[0], minVals[0], 0);
        }
      }
      continue;
    }

    if (hasSeconds && !secVals.includes(d.getSeconds())) {
      const nextS = secVals.find(s => s > d.getSeconds());
      if (nextS !== undefined) {
        d.setSeconds(nextS);
      } else {
        const nextM = minVals.find(m => m > d.getMinutes());
        if (nextM !== undefined) {
          d.setMinutes(nextM, secVals[0], 0);
        } else {
          const nextH = hourVals.find(h => h > d.getHours());
          if (nextH !== undefined) {
            d.setHours(nextH, minVals[0], secVals[0], 0);
          } else {
            d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, hourVals[0], minVals[0], secVals[0]);
          }
        }
      }
      continue;
    }

    results.push(new Date(d.getTime()));

    // Advance
    if (hasSeconds) {
      d.setSeconds(d.getSeconds() + 1);
    } else {
      d.setMinutes(d.getMinutes() + 1);
    }
  }

  return results;
}

function formatDate(d) {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} at ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

// ─── Builder State ───
// mode per field: 'every' | 'specific' | 'range' | 'step'
let fieldModes = {};
let fieldSpecific = {}; // set of selected values per field
let fieldRange = {};    // {from, to} per field
let fieldStep = {};     // {start, n} per field

function initFieldState() {
  const cfgs = getConfigs();
  fieldModes = {};
  fieldSpecific = {};
  fieldRange = {};
  fieldStep = {};
  for (let i = 0; i < cfgs.length; i++) {
    fieldModes[i] = 'every';
    fieldSpecific[i] = new Set();
    fieldRange[i] = { from: cfgs[i].min, to: cfgs[i].max };
    fieldStep[i] = { start: cfgs[i].min, n: 1 };
  }
}

function fieldToExpression(i) {
  const cfgs = getConfigs();
  const cfg = cfgs[i];
  const mode = fieldModes[i];
  switch (mode) {
    case 'every': return '*';
    case 'specific': {
      const vals = Array.from(fieldSpecific[i]).sort((a,b) => a - b);
      if (vals.length === 0) return '*';
      return vals.join(',');
    }
    case 'range': {
      return `${fieldRange[i].from}-${fieldRange[i].to}`;
    }
    case 'step': {
      const start = fieldStep[i].start;
      const n = fieldStep[i].n;
      if (start === cfg.min) return `*/${n}`;
      return `${start}/${n}`;
    }
  }
  return '*';
}

function buildExpression() {
  const cfgs = getConfigs();
  return cfgs.map((_, i) => fieldToExpression(i)).join(' ');
}

// ─── UI Rendering ───
function renderFieldTabs() {
  const cfgs = getConfigs();
  const container = document.getElementById('fieldTabs');
  container.innerHTML = '';
  cfgs.forEach((cfg, i) => {
    const btn = document.createElement('button');
    btn.className = `field-tab px-3 py-1.5 text-sm rounded border border-gray-700 ${i === activeField ? 'active' : ''}`;
    btn.textContent = cfg.label;
    btn.onclick = () => { activeField = i; render(); };
    container.appendChild(btn);
  });
}

function renderFieldHeaders() {
  const cfgs = getConfigs();
  const hdr = document.getElementById('fieldHeaders');
  hdr.innerHTML = '';
  const names = useSeconds
    ? ['sec','min','hour','day','month','dow']
    : ['min','hour','day','month','dow'];
  names.forEach(n => {
    const span = document.createElement('span');
    span.className = 'flex-1 text-center';
    span.textContent = n;
    hdr.appendChild(span);
  });
}

function renderModeButtons() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === fieldModes[activeField]);
  });
}

function renderPanels() {
  const mode = fieldModes[activeField];
  document.getElementById('panelEvery').classList.toggle('hidden', mode !== 'every');
  document.getElementById('panelSpecific').classList.toggle('hidden', mode !== 'specific');
  document.getElementById('panelRange').classList.toggle('hidden', mode !== 'range');
  document.getElementById('panelStep').classList.toggle('hidden', mode !== 'step');

  if (mode === 'every') {
    document.getElementById('everyLabel').textContent = getConfigs()[activeField].unit.replace('(s)', '(s)').replace('second(s)','seconds').replace('minute(s)','minutes').replace('hour(s)','hours').replace('day(s)','days').replace('month(s)','months');
  }
}

function renderSpecificGrid() {
  const cfgs = getConfigs();
  const cfg = cfgs[activeField];
  const grid = document.getElementById('specificGrid');
  grid.innerHTML = '';

  // Adjust column count based on max values
  const cols = cfg.max <= 12 ? 6 : cfg.max <= 24 ? 8 : 10;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  for (let v = cfg.min; v <= cfg.max; v++) {
    const cell = document.createElement('button');
    const isActive = fieldSpecific[activeField].has(v);
    cell.className = `toggle-cell border border-gray-700 rounded text-center py-1 text-sm mono cursor-pointer ${isActive ? 'active' : ''}`;
    cell.textContent = cfg.names ? cfg.names[v] : v;
    cell.onclick = () => {
      if (fieldSpecific[activeField].has(v)) {
        fieldSpecific[activeField].delete(v);
      } else {
        fieldSpecific[activeField].add(v);
      }
      fieldModes[activeField] = 'specific';
      onBuilderChange();
    };
    grid.appendChild(cell);
  }
}

function renderRangeSelects() {
  const cfgs = getConfigs();
  const cfg = cfgs[activeField];
  const fromSel = document.getElementById('rangeFrom');
  const toSel = document.getElementById('rangeTo');
  fromSel.innerHTML = '';
  toSel.innerHTML = '';

  for (let v = cfg.min; v <= cfg.max; v++) {
    const label = cfg.names ? cfg.names[v] : v;
    fromSel.innerHTML += `<option value="${v}">${label}</option>`;
    toSel.innerHTML += `<option value="${v}">${label}</option>`;
  }
  fromSel.value = fieldRange[activeField].from;
  toSel.value = fieldRange[activeField].to;
}

function renderStepSelects() {
  const cfgs = getConfigs();
  const cfg = cfgs[activeField];
  const startSel = document.getElementById('stepStart');
  const nSel = document.getElementById('stepN');
  startSel.innerHTML = '';
  nSel.innerHTML = '';

  for (let v = cfg.min; v <= cfg.max; v++) {
    const label = cfg.names ? cfg.names[v] : v;
    startSel.innerHTML += `<option value="${v}">${label}</option>`;
  }
  const maxStep = cfg.max - cfg.min + 1;
  for (let n = 1; n <= maxStep; n++) {
    nSel.innerHTML += `<option value="${n}">${n}</option>`;
  }
  startSel.value = fieldStep[activeField].start;
  nSel.value = fieldStep[activeField].n;
  document.getElementById('stepUnit').textContent = cfg.unit;
}

function renderPresets() {
  const grid = document.getElementById('presetsGrid');
  grid.innerHTML = '';
  PRESETS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn px-3 py-2 text-xs rounded border border-gray-700 text-gray-300 text-left truncate';
    btn.textContent = p.label;
    btn.title = p.expr;
    btn.onclick = () => applyPreset(p.expr);
    grid.appendChild(btn);
  });
}

function renderExecutions() {
  const expr = document.getElementById('cronInput').value;
  const list = document.getElementById('execList');
  const execs = nextExecutions(expr, 10);

  if (execs.length === 0) {
    if (expr.trim().toLowerCase() === '@reboot') {
      list.innerHTML = '<div class="text-gray-500 text-xs">No scheduled times (@reboot runs at system startup only)</div>';
    } else {
      list.innerHTML = '<div class="text-red-400/70 text-xs">Could not compute next executions. Check expression.</div>';
    }
    return;
  }

  list.innerHTML = execs.map((d, i) =>
    `<div class="flex justify-between items-center py-1 px-2 rounded hover:bg-white/5">
      <span class="text-gray-500 text-xs w-6">${i + 1}.</span>
      <span class="text-brand-300 text-xs">${formatDate(d)}</span>
    </div>`
  ).join('');
}

function renderDescription() {
  const expr = document.getElementById('cronInput').value;
  const desc = describe(expr);
  document.getElementById('description').textContent = desc;

  // Syntax notice
  const trimmed = expr.trim().toLowerCase();
  const notice = document.getElementById('syntaxNotice');
  const info = document.getElementById('syntaxInfo');

  if (trimmed.startsWith('@')) {
    notice.classList.remove('hidden');
    const aliasMap = {
      '@yearly': 'Equivalent to: 0 0 1 1 *',
      '@annually': 'Equivalent to: 0 0 1 1 *',
      '@monthly': 'Equivalent to: 0 0 1 * *',
      '@weekly': 'Equivalent to: 0 0 * * 0',
      '@daily': 'Equivalent to: 0 0 * * *',
      '@hourly': 'Equivalent to: 0 * * * *',
      '@reboot': 'Runs once at system startup (not schedulable)',
    };
    info.textContent = aliasMap[trimmed] || 'Special alias expression';
  } else {
    // Check which fields use non-* syntax
    const parts = trimmed.split(/\s+/);
    const configs = useSeconds ? FIELD_CONFIGS_6 : FIELD_CONFIGS_5;
    const labels = useSeconds
      ? ['Second','Minute','Hour','Day of Month','Month','Day of Week']
      : ['Minute','Hour','Day of Month','Month','Day of Week'];

    if (parts.length === configs.length) {
      const specialFields = [];
      parts.forEach((p, i) => {
        if (p !== '*') {
          const syntaxType = [];
          if (p.includes(',')) syntaxType.push('list');
          if (p.includes('-')) syntaxType.push('range');
          if (p.includes('/')) syntaxType.push('step');
          if (syntaxType.length === 0) syntaxType.push('fixed value');
          specialFields.push(`${labels[i]}: "${p}" (${syntaxType.join(', ')})`);
        }
      });
      if (specialFields.length > 0) {
        notice.classList.remove('hidden');
        info.innerHTML = specialFields.map(f => `<div class="py-0.5">${f}</div>`).join('');
      } else {
        notice.classList.add('hidden');
      }
    } else {
      notice.classList.add('hidden');
    }
  }
}

// ─── Event Handlers ───
function setMode(mode) {
  fieldModes[activeField] = mode;
  onBuilderChange();
}

function onRangeChange() {
  fieldRange[activeField].from = parseInt(document.getElementById('rangeFrom').value);
  fieldRange[activeField].to = parseInt(document.getElementById('rangeTo').value);
  fieldModes[activeField] = 'range';
  onBuilderChange();
}

function onStepChange() {
  fieldStep[activeField].start = parseInt(document.getElementById('stepStart').value);
  fieldStep[activeField].n = parseInt(document.getElementById('stepN').value);
  fieldModes[activeField] = 'step';
  onBuilderChange();
}

function onBuilderChange() {
  const expr = buildExpression();
  document.getElementById('cronInput').value = expr;
  document.getElementById('fieldDirect').value = fieldToExpression(activeField);
  render();
}

function onCronInput(value) {
  // Parse the expression and update builder state
  importExpressionToBuilder(value);
  render();
}

function onFieldDirect(value) {
  const cfgs = getConfigs();
  const cfg = cfgs[activeField];
  const parsed = parseField(value.trim(), cfg.min, cfg.max);
  if (parsed) {
    // Determine mode from the value
    const v = value.trim();
    if (v === '*') {
      fieldModes[activeField] = 'every';
    } else if (v.includes('/')) {
      fieldModes[activeField] = 'step';
      if (v.startsWith('*/')) {
        fieldStep[activeField].start = cfg.min;
        fieldStep[activeField].n = parseInt(v.split('/')[1]);
      } else {
        const [start, n] = v.split('/');
        fieldStep[activeField].start = parseInt(start);
        fieldStep[activeField].n = parseInt(n);
      }
    } else if (v.includes('-') && !v.includes(',')) {
      fieldModes[activeField] = 'range';
      const [a, b] = v.split('-');
      fieldRange[activeField].from = parseInt(a);
      fieldRange[activeField].to = parseInt(b);
    } else {
      fieldModes[activeField] = 'specific';
      fieldSpecific[activeField] = new Set(parsed);
    }

    onBuilderChange();
  }
}

function importExpressionToBuilder(expr) {
  const trimmed = expr.trim().toLowerCase();
  const resolved = resolveAlias(trimmed);
  if (resolved === null) return;

  const parts = resolved.split(/\s+/);
  const cfgs = getConfigs();
  const expectedLen = cfgs.length;

  if (parts.length !== expectedLen) return;

  for (let i = 0; i < expectedLen; i++) {
    const v = parts[i];
    const cfg = cfgs[i];

    if (v === '*') {
      fieldModes[i] = 'every';
    } else if (v.includes('/')) {
      fieldModes[i] = 'step';
      const [startStr, nStr] = v.split('/');
      fieldStep[i].start = startStr === '*' ? cfg.min : parseInt(startStr);
      fieldStep[i].n = parseInt(nStr);
    } else if (v.includes('-') && !v.includes(',')) {
      fieldModes[i] = 'range';
      const [a, b] = v.split('-');
      fieldRange[i].from = parseInt(a);
      fieldRange[i].to = parseInt(b);
    } else {
      fieldModes[i] = 'specific';
      const parsed = parseField(v, cfg.min, cfg.max);
      fieldSpecific[i] = new Set(parsed || []);
    }
  }
}

function applyPreset(expr) {
  if (expr.startsWith('@')) {
    document.getElementById('cronInput').value = expr;
    onCronInput(expr);
    return;
  }

  // Convert preset to current field mode
  const parts = expr.split(/\s+/);
  if (useSeconds) {
    // Prepend seconds = 0
    parts.unshift('0');
  } else {
    // If preset has seconds, remove it
    if (parts.length === 6) parts.shift();
  }

  const adjusted = parts.join(' ');
  document.getElementById('cronInput').value = adjusted;
  onCronInput(adjusted);
}

function toggleFieldMode() {
  const input = document.getElementById('cronInput');
  const currentVal = input.value.trim();
  const parts = currentVal.split(/\s+/);

  if (useSeconds) {
    // Switch from 6 to 5: drop seconds field
    useSeconds = false;
    if (parts.length === 6) {
      input.value = parts.slice(1).join(' ');
    }
  } else {
    // Switch from 5 to 6: add seconds = 0
    useSeconds = true;
    if (parts.length === 5) {
      input.value = '0 ' + currentVal;
    }
  }

  document.getElementById('fieldLabel').textContent = useSeconds ? '6-field (with seconds)' : '5-field (standard)';
  initFieldState();
  importExpressionToBuilder(input.value);
  render();
}

function copyExpression() {
  const expr = document.getElementById('cronInput').value;
  navigator.clipboard.writeText(expr).then(() => {
    const btn = document.getElementById('copyBtn');
    const origHTML = btn.innerHTML;
    btn.innerHTML = '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Copied!';
    btn.classList.add('copy-flash');
    setTimeout(() => {
      btn.innerHTML = origHTML;
      btn.classList.remove('copy-flash');
    }, 1500);
  });
}

// ─── Main Render ───
function render() {
  renderFieldTabs();
  renderFieldHeaders();
  renderModeButtons();
  renderPanels();
  renderSpecificGrid();
  renderRangeSelects();
  renderStepSelects();
  renderDescription();
  renderExecutions();

  // Update field direct input
  const cfgs = getConfigs();
  if (activeField < cfgs.length) {
    document.getElementById('fieldDirect').value = fieldToExpression(activeField);
  }
}

// ─── Init ───
function init() {
  initFieldState();
  renderPresets();
  document.getElementById('cronInput').value = '* * * * *';
  render();
}

init();
</script>
